# -------------------- Recceiver Configuration --------------------
# All values can be overridden at runtime via:
#   - Environment variables (e.g. ANNOUNCEINTERVAL=30)
#   - Command-line args     (e.g. --announceInterval=30)
#   - A custom application.properties on the classpath/file system

# -------------------- TCP Listener --------------------

# Network interface address the TCP listener binds to.
# Use 0.0.0.0 to accept connections on all interfaces (recommended for servers),
# or a specific IP to restrict to one interface.
tcpBindAddress=localhost

# TCP port to listen on. 0 lets the OS assign a free ephemeral port (useful in
# tests or when UDP discovery is relied on for port advertisement).
# Set a fixed port (e.g. 5064) to allow direct connections without UDP discovery.
tcpPort=0

# TCP idle timeout (in seconds). A ping is sent to the client after this
# interval; if no pong is received before the next ping the connection is
# closed. Must be > 0.
tcptimeout=15.0

# Size (in bytes) of the TCP read buffer used per connection. Larger values
# reduce the number of read syscalls for high-throughput clients but increase
# per-connection memory. The RecSync header is 8 bytes, so this must be >= 8.
readBufferSize=4096

# -------------------- UDP Discovery Beacon --------------------

# Destination address for UDP announcement packets. Use 255.255.255.255 for
# limited broadcast, or a subnet-directed broadcast / multicast address.
udpBroadcastAddress=255.255.255.255

# UDP port that RecSync clients listen on for server announcements.
# The RecSync protocol default is 5049.
udpBroadcastPort=5049

# How often (in seconds) the UDP beacon is broadcast so clients can discover
# the TCP listener port. Lower values reduce discovery latency at the cost of
# slightly more network chatter.
announceInterval=15.0

# -------------------- Transaction Dispatch --------------------

# How often (in seconds) accumulated record/info changes are bundled into a
# transaction and dispatched to RecSyncProcessor implementations.
# Set to 0 to dispatch on every upload-complete message (0x0005).
commitInterval=5.0

# Maximum number of record changes to accumulate before forcing an early
# commit, regardless of commitInterval. 0 means unlimited.
commitSizeLimit=0

# -------------------- ChannelFinder Integration --------------------

# Enable ChannelFinder processor to publish records as channels.
recceiver.cf.enabled=true

# ChannelFinder service base URL (HTTP PUT endpoint for channel updates).
# Example: http://localhost:8080/ChannelFinder
recceiver.cf.service-url=http://localhost:9090/ChannelFinder

# Optional ChannelFinder basic-auth credentials.
# If one is set, both username and password must be set.
recceiver.cf.username=admin
recceiver.cf.password=adminPass

# For every cleanup and IOC disconnection:
# true => delete channels, false => keep channels and update their pvStatus.
recceiver.cf.delete-on-clean=false

# On startup, clean this recceiver's channels:
# delete-on-clean=true => delete all of them
# delete-on-clean=false => set pvStatus=Inactive
# false => startup does not touch ChannelFinder
recceiver.cf.clean-on-startup=false

# On application shutdown, clean this recceiver's channels:
# delete-on-clean=true  => delete all of them (any pvStatus)
# delete-on-clean=false => set pvStatus=Unknown
# false => shutdown does not touch ChannelFinder.
recceiver.cf.clean-on-shutdown=true

# Publish alias records as channels with property alias=<primaryPV>.
recceiver.cf.alias-enabled=true

# Whitespace/comma separated record info tags to persist as ChannelFinder properties.
# Example: archive device
recceiver.cf.infotags=archive,device

# Comma-separated list of ENV:PropertyName mappings copied from client info.
# Example: ENGINEER:Engineer,EPICS_BASE:EpicsVersion,PWD:WorkingDirectory
recceiver.cf.environment-vars=ARCH:architecture,PWD:workingDir

